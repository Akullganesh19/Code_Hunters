name: TraceLayer Hourly Health Check

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock --legacy-peer-deps

      - name: Run engine tests
        run: npx tsx --test src/engine/tracelayer.test.ts

      - name: Type-check
        run: npm run lint

      - name: Build production bundle
        run: npm run build
