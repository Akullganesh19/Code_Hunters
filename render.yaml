services:
  - type: web
    name: tracelayer-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start --workspace @tracelayer/backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        sync: false
      - fromGroup: tracelayer-secrets

  - type: web
    name: tracelayer-agent
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start --workspace tracelayer-agent-platform-upgrade
    healthCheckPath: /api/agent/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: AGENT_RUNS_DB_PATH
        value: /tmp/agent-runs.sqlite
      - key: AGENT_MODEL_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AGENT_MODEL
        value: openai/gpt-oss-120b
      - key: AGENT_MODEL_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - fromGroup: tracelayer-secrets

envVarGroups:
  - name: tracelayer-secrets
    envVars:
      - key: TRACELAYER_INTERNAL_TOKEN
        generateValue: true
